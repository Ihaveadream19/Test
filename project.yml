
name: WebsiteApp

options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "15.0"

targets:
  WebsiteApp:
    type: application
    platform: iOS
    sources:
      - Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.websiteapp
        INFOPLIST_KEY_CFBundleDisplayName: Website
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.0"
        IPHONEOS_DEPLOYMENT_TARGET: "15.0"
        TARGETED_DEVICE_FAMILY: "1,2"
